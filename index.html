<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ từ vựng Hàn – Anh</title>
<meta name="theme-color" content="#F1F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A1C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ từ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-lang="ko">
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="lang" role="group" aria-label="Ngôn ngữ đang học">
        <button data-l="ko" aria-pressed="true" lang="ko">한국어</button>
        <button data-l="en" aria-pressed="false" lang="en">English</button>
        <button data-l="zh" aria-pressed="false" lang="zh">中文</button>
      </div>
      <button class="sync" id="sync" data-s="local" type="button"><i></i><span>Lưu trên máy này</span></button>
    </div>
    <div class="stats" id="stats"></div>
    <nav class="tabs" aria-label="Chế độ học">
      <button data-v="review">Ôn thẻ</button>
      <button data-v="quiz">Kiểm tra</button>
      <button data-v="listen">Nghe</button>
      <button data-v="book">Sách</button>
      <button data-v="list">Từ vựng</button>
      <button data-v="settings">Cài đặt</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>

<script src="data-ko.js"></script>
<script src="data-en.js"></script>
<script src="data-zh.js"></script>
<script src="app.js"></script>
</body>
</html>
