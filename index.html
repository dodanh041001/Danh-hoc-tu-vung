<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ từ vựng Hàn – Anh</title>
<meta name="theme-color" content="#F1F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A1C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ từ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F5F2; --surface:#FFFFFF; --ink:#1C272B; --muted:#5A696C; --line:#D3DED8;
  --grid:#8FC2A3; --ko:#AE2F3A; --en:#1C5C8C; --on-acc:#FFFFFF;
  --ok:#2A7849; --warn:#9E6A0C; --bad:#AE2F3A;
  --sheet-line:#D2DFEA; --margin:#E39BA1;
  --acc:var(--ko);
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --kr:'Gowun Batang','Noto Serif KR','AppleMyungjo','Batang','Apple SD Gothic Neo','Malgun Gothic',serif;
  --r-sm:7px; --r-md:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111A1C; --surface:#182326; --ink:#E3ECE8; --muted:#97A8A7; --line:#2A393C;
    --grid:#3E7657; --ko:#E86F7A; --en:#74B0DF; --on-acc:#111A1C;
    --ok:#5DBC84; --warn:#E2A94B; --bad:#E86F7A;
    --sheet-line:#283A47; --margin:#7B3E45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111A1C; --surface:#182326; --ink:#E3ECE8; --muted:#97A8A7; --line:#2A393C;
  --grid:#3E7657; --ko:#E86F7A; --en:#74B0DF; --on-acc:#111A1C;
  --ok:#5DBC84; --warn:#E2A94B; --bad:#E86F7A;
  --sheet-line:#283A47; --margin:#7B3E45; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body[data-lang="en"]{--acc:var(--en)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.kr{font-family:var(--kr)}
[hidden]{display:none!important}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.lang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 15px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.lang button[data-l="ko"]{font-family:var(--kr);font-weight:700}
.lang button[aria-pressed="true"][data-l="ko"]{background:var(--ko);color:var(--on-acc)}
.lang button[aria-pressed="true"][data-l="en"]{background:var(--en);color:var(--on-acc)}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);border:0;background:none;padding:4px 0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="saving"] i,.sync[data-s="offline"] i{background:var(--warn)}
.sync[data-s="err"] i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0 8px}
.stat b{display:block;font-size:21px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.stat.due b{color:var(--acc)}
.stat .of{font-style:normal;font-size:13px;font-weight:500;color:var(--muted)}
.tabs{display:flex;gap:2px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 11px;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main.wrap{padding-top:6px;padding-bottom:48px}
@media (max-width:719px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
  .tabs button{border-bottom:0;border-top:2.5px solid transparent;padding:11px 1px 13px;font-size:13px}
  .tabs button[aria-current="page"]{border-top-color:var(--acc)}
  main.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  #view button,#view input,#fb{scroll-margin-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .stat b{font-size:19px}
  .stats{gap:8px}
  .stat span{font-size:12px}
}

/* Shared controls */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 4px}
.tsel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex:1 1 220px;min-width:0}
.sel,.inp{border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:9px 11px;font-size:15px;min-width:0}
.tsel .sel{flex:1}
.inp{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r-sm);background:var(--acc);color:var(--on-acc);padding:13px 18px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);width:auto}
.btn.auto{width:auto}
.btns{display:grid;gap:10px;margin-top:14px}
kbd{font:500 11.5px var(--sans);padding:1px 6px;border:1px solid currentColor;border-radius:4px;opacity:.7}
@media (hover:none){kbd{display:none}}
.muted{color:var(--muted)}
.small{font-size:14px}
h2{font-size:22px;line-height:1.3;margin:22px 0 6px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 10px;font-weight:600}
.say{flex:none;width:38px;height:38px;display:inline-grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);vertical-align:middle}
.say:hover{border-color:var(--acc);color:var(--acc)}
.say.sm{width:32px;height:32px}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* Review counts */
.counts{display:flex;gap:16px;font-size:14px;color:var(--muted);margin:12px 0 0}
.counts b{font-variant-numeric:tabular-nums;margin-right:3px}
.c-new b{color:var(--acc)} .c-learn b{color:var(--warn)} .c-rev b{color:var(--ok)}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 18px 18px;margin:12px 0 14px;min-height:250px;display:flex;flex-direction:column}
.topicline{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 0 10px;text-align:center}
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding-left:1.5px;max-width:100%}
.cell{--s:clamp(48px,14vw,68px);width:var(--s);height:var(--s);border:1.5px solid var(--grid);margin:0 0 -1.5px -1.5px;display:grid;place-items:center;font-family:var(--kr);font-weight:700;font-size:calc(var(--s)*.58);line-height:1;color:var(--ink);background:var(--surface)}
.grid.long .cell{--s:clamp(34px,9.5vw,50px)}
.cell.sp{background:transparent}
.sheet{width:100%;padding:0 10px 2px 40px;text-align:left;background-image:linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 28px,transparent 28px),repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--sheet-line) 43px,var(--sheet-line) 44px)}
.eword{font-size:clamp(26px,7.4vw,36px);font-weight:600;letter-spacing:-.015em;line-height:44px;word-break:break-word}
.pos{font-style:italic;color:var(--muted);font-size:15px;margin-left:6px}
.vn-front{font-size:clamp(22px,6vw,28px);font-weight:600;line-height:1.35;max-width:26ch}
.hint{margin:0;font-size:13.5px;color:var(--muted)}
.back{border-top:1px dashed var(--line);margin-top:6px;padding-top:16px;display:grid;gap:12px;animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.back{animation:none}}
.ansrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.meaning{font-size:21px;font-weight:600;line-height:1.35}
.meta{font-size:14.5px;line-height:1.5}
.meta span{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.ex{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex p{margin:0;font-size:17.5px;line-height:1.55}
.ex p[lang="ko"]{font-family:var(--kr);font-size:18.5px}
.hl{color:var(--acc);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.exv{color:var(--muted);font-size:14.5px;margin:-6px 0 0}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 2px 8px;font-weight:600;font-size:15.5px;color:var(--g)}
.grades button:hover{border-color:var(--g)}
.grades small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px}
.g0{--g:var(--bad)} .g1{--g:var(--warn)} .g2{--g:var(--ok)} .g3{--g:var(--en)}
.done{text-align:center;padding:26px 6px 6px}
.done .grid{margin:0 auto 4px}
.done .sheet{max-width:280px;margin:0 auto;text-align:center;padding-left:40px}
.done p{max-width:38ch;margin:6px auto 0}

/* Quiz */
.types{display:grid;gap:8px;margin:14px 0}
.type{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px}
.type[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.type b{display:block;font-weight:600}
.type small{color:var(--muted);font-size:13.5px}
.radio{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;margin-top:3px}
.type[aria-pressed="true"] .radio{border-color:var(--acc);background:radial-gradient(circle,var(--acc) 0 4px,transparent 5px)}
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:16px 0 6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 18px;margin:12px 0;text-align:center}
.ask{margin:0 0 12px;font-size:14px;color:var(--muted)}
.qword{font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qword.kr{font-weight:700}
.qmean{font-size:22px;font-weight:600}
.qsent{font-size:18.5px;line-height:1.6;text-align:left}
.qsent.kr{font-size:20px}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--acc);color:transparent;line-height:1.1}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;line-height:1.45}
.opt .n{flex:none;font-size:12.5px;color:var(--muted);font-weight:600;width:1em}
.opt.kr{font-family:var(--kr);font-size:18px}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;border-left:3px solid var(--ok);padding:4px 0 4px 14px;display:grid;gap:6px}
.fb.no{border-left-color:var(--bad)}
.fb .verdict{font-weight:700;color:var(--ok)}
.fb.no .verdict{color:var(--bad)}
.fb p{margin:0}
.fb .ex p{font-size:16px}
.fb .ex p[lang="ko"]{font-size:17px}
.play{display:flex;flex-direction:column;align-items:center;gap:12px}
.playbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.typed{display:flex;gap:8px;margin-top:4px}
.typed .inp{font-size:18px}
.typed .btn{width:auto;flex:none}
.score{font-size:56px;font-weight:700;line-height:1;margin-top:24px;font-variant-numeric:tabular-nums}
.score span{font-size:24px;color:var(--muted);font-weight:500}
.misslist{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.misslist b{font-weight:600}

/* Word list */
.chips{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin:10px 0}
.chips b{color:var(--ink)}
.wl{border-top:1px solid var(--line);margin-top:10px}
.wl details{border-bottom:1px solid var(--line)}
.wl summary{display:flex;align-items:baseline;gap:12px;padding:12px 2px;cursor:pointer;list-style:none}
.wl summary::-webkit-details-marker{display:none}
.w-word{font-weight:600;flex:none;max-width:48%}
.w-word.kr{font-size:18px;font-weight:700}
.w-m{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tag{flex:none;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.learning{color:var(--warn);border-color:currentColor}
.tag.known{color:var(--ok);border-color:currentColor}
.w-body{padding:2px 2px 16px;display:grid;gap:10px}
.w-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.empty{padding:28px 4px;color:var(--muted);text-align:center}
.formbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px;display:grid;gap:12px}
.field label{display:block;font-size:13.5px;font-weight:500;margin-bottom:4px}
.field .inp{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:14px;margin:0}
.msg.ok{color:var(--ok)} .msg.no{color:var(--bad)}
.notice{border-left:3px solid var(--warn);background:var(--surface);padding:10px 12px;font-size:14px;margin:12px 0;border-radius:0 var(--r-sm) var(--r-sm) 0}

/* Settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin:14px 0}
.set label.line .sel{min-width:96px}
.set label.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.set .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.set .seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 8px;font-size:14.5px}
.set .seg button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
.set p{margin:6px 0 0;font-size:14px}
/* book */
.scopebar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r-sm);padding:9px 12px;font-size:14.5px;font-weight:500}
.range{display:flex;align-items:center;gap:10px}
.range .sel{flex:1}
.btns.two{grid-template-columns:1fr 1fr}
.units{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
.unit{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.unit:hover{border-color:var(--acc)}
.unit.inrange{box-shadow:inset 3px 0 0 var(--acc)}
.un{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--grid);font-weight:700;font-variant-numeric:tabular-nums}
.ut{flex:1;min-width:0}
.ut b{display:block;font-size:17px;line-height:1.35}
.ut small{color:var(--muted);font-size:13px}
.up{flex:none;width:62px;text-align:right}
.mini{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:5px}
.mini i{display:block;height:100%;background:var(--acc)}
.up small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.units .rev{font-size:13px;color:var(--muted);padding:6px 2px}
.utitle{margin:4px 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3.sec{margin:26px 0 8px}
.gram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin:10px 0}
.gp{font-size:19px;font-weight:700;color:var(--acc)}
.gt{font-weight:600;margin:2px 0 6px}
.gram>p{margin:0 0 12px;font-size:15px;line-height:1.55}
.gex{list-style:none;padding:0;margin:0;display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.gex .exv{margin:2px 0 0}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.wrow .w-word{font-size:17px}
.w-m2{flex:1;min-width:0;font-size:15px;color:var(--ink)}
.w-m2 small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.unav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
/* sync */
.gsteps{padding-left:20px;margin:12px 0;font-size:14px;line-height:1.55}
.gsteps li{margin:6px 0}
.set a{color:var(--acc);font-weight:600}
code{font-size:13px;background:var(--paper);border:1px solid var(--line);padding:0 5px;border-radius:4px}
/* voice */
.vrow{padding:6px 0 10px}
.vrow label{display:block;margin-bottom:6px}
.vsel{display:flex;gap:8px;align-items:center}
.vsel .sel{flex:1;min-width:0;width:100%}
.vq{font-size:13.5px;margin:6px 0 0}
.vq.good{color:var(--ok)} .vq.basic{color:var(--warn)}
.tips{margin-top:6px;border-top:1px solid var(--line)}
.tips summary{cursor:pointer;font-weight:600;color:var(--acc);padding:12px 0 2px}
.tips p{margin:10px 0 0;font-size:14px;line-height:1.55}
.tips b{font-weight:600}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--acc)}
</style>
</head>
<body data-lang="ko">
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="lang" role="group" aria-label="Ngôn ngữ đang học">
        <button data-l="ko" aria-pressed="true" lang="ko">한국어</button>
        <button data-l="en" aria-pressed="false" lang="en">English</button>
      </div>
      <button class="sync" id="sync" data-s="local" type="button"><i></i><span>Lưu trên máy này</span></button>
    </div>
    <div class="stats" id="stats"></div>

{q:"Many people use their phones too much.",o:["Excessive smartphone use has become widespread.","Many people use phones excessive.","Smartphone using is too much by many people."],why:"“Excessive” là tính từ đứng trước danh từ “use”. Câu 2 sai vì cần trạng từ “excessively”; câu 3 sai cấu trúc."},
{q:"Pollution is a very big problem.",o:["Pollution poses a serious threat to public health.","Pollution makes a serious threat to public health.","Pollution is a very heavy problem."],why:"Collocation đúng là “pose a threat”, không phải “make a threat”; “heavy problem” không tự nhiên trong tiếng Anh."},
{q:"The number of students went up a lot.",o:["There was a significant increase in student numbers.","The number of students increased significant.","The students number went up very much."],why:"“An increase in + N”; khi bổ nghĩa cho động từ phải dùng trạng từ “significantly”."},
{q:"Children learn a lot from their parents.",o:["Parents play a crucial role in shaping their children's behaviour.","Parents play a crucial role to shape their children's behaviour.","Parents make an important role in their children's behaviour."],why:"Cấu trúc là “play a role in + V-ing”, không dùng “to V” và không dùng “make a role”."},
{q:"The good points are more than the bad points.",o:["The advantages outweigh the disadvantages.","The advantages are outweigh the disadvantages.","The advantages outweigh than the disadvantages."],why:"“Outweigh” là động từ nên không cần “are”, và không đi với “than”."},
{q:"The government should do something about traffic jams.",o:["The government should take measures to ease traffic congestion.","The government should do measures to reduce traffic jam.","The government should take measures to easy traffic congestion."],why:"Collocation là “take measures”; “ease” là động từ, còn “easy” là tính từ."},
{q:"People in the countryside move to cities to find jobs.",o:["Many rural residents migrate to urban areas in search of employment.","Many rural residents migrate to urban areas for searching employment.","Many rural people migrates to city area to find job."],why:"Cụm cố định là “in search of”. Câu 3 sai chia động từ (migrates) và thiếu mạo từ / số nhiều."},
{q:"Smoking is very bad for your health.",o:["Smoking is extremely detrimental to health.","Smoking is extremely harmful with health.","Smoking causes very bad affects to health."],why:"Dùng “detrimental / harmful to”, không dùng “with”. “Affect” là động từ, danh từ phải là “effect” và đi với “on”."},
{q:"Because of the internet, we can get information easily.",o:["The internet has made information far more accessible.","The internet has made information more access.","Due to the internet, we can get information easy."],why:"Sau “make + O” cần tính từ “accessible”; “easy” là tính từ, bổ nghĩa động từ phải dùng “easily”."},
{q:"I agree a little with this idea.",o:["I agree with this view to some extent.","I agree this view to some extent.","I am agree with this view in some extent."],why:"Phải nói “agree with”, không dùng “am agree”; cụm đúng là “to some extent”."},
{q:"Life is more expensive now.",o:["The cost of living has risen considerably.","The cost of living has raised considerably.","The living cost has risen considerable."],why:"“Rise” là nội động từ (rise–rose–risen), còn “raise” cần tân ngữ. Bổ nghĩa động từ cần trạng từ “considerably”."},
{q:"Many young people don't have jobs.",o:["Youth unemployment remains a serious concern.","Young unemployment remains a serious concern.","Youth unemployment remain a serious concern."],why:"Cụm đúng là “youth unemployment”; chủ ngữ số ít nên động từ là “remains”."},
{q:"There are more old people than before.",o:["The proportion of elderly people has grown steadily.","The proportion of elderly people has grown steady.","The proportion of old peoples has growth steadily."],why:"Bổ nghĩa động từ cần trạng từ “steadily”; “people” đã là số nhiều; “growth” là danh từ."},
{q:"Watching TV a lot is not good for kids.",o:["Excessive screen time can have a negative impact on children.","Excessive screen time can have a negative impact to children.","Excessive screen time can make a negative effect for children."],why:"Cấu trúc đúng: “have an impact / effect on”."},
{q:"Some people think university should be free, other people think students should pay.",o:["While some argue that university should be free, others believe students should contribute to the cost.","Despite some argue that university should be free, others believe students should contribute to the cost.","Some argue that university should be free, whereas others believes students should contributing to the cost."],why:"“Despite” không đi với mệnh đề. Câu 3 sai “others believe” (số nhiều) và “should + V nguyên mẫu”."},
{q:"Many animals are dying because forests are cut down.",o:["Deforestation is pushing many species towards extinction.","Deforestation is pushing many species to extinct.","Deforestation makes many species extinction."],why:"“Towards / to + danh từ extinction”; “extinct” là tính từ."},
{q:"Online learning is convenient but it has problems.",o:["Despite its convenience, online learning has several drawbacks.","Despite it is convenient, online learning has several drawbacks.","Although its convenience, online learning has several drawback."],why:"Despite + danh từ (its convenience); Although + mệnh đề. “Several” đi với danh từ số nhiều."},
{q:"Companies should pay workers more money.",o:["Companies should offer their employees more competitive salaries.","Companies should offer their employees a more competitive salaries.","Companies should give employees salaries more competitive."],why:"Không dùng “a” với danh từ số nhiều; tính từ đứng trước danh từ."}

PARA.push(
{q:"Many people think university is very important.",o:["It is widely believed that a university degree is essential.","It is widely believed that university degree is essential.","It widely believes that university is very essential."],why:"Danh từ đếm được số ít “degree” cần mạo từ “a”. Cấu trúc đúng là “It is widely believed that…” (bị động). “Essential” đã mang nghĩa rất quan trọng nên không dùng “very essential”."},
{q:"This problem is getting worse and worse.",o:["This problem has become increasingly serious.","This problem has become increasing serious.","This problem is getting more worse."],why:"Bổ nghĩa tính từ “serious” phải dùng trạng từ “increasingly”. “Worse” đã là dạng so sánh hơn nên không thêm “more”."},
{q:"Tourists come and the place becomes dirty.",o:["Mass tourism can lead to environmental degradation.","Mass tourism can lead to environment degrade.","Mass tourism can lead the environmental degradation."],why:"Cấu trúc là “lead to + danh từ”: environmental (tính từ) + degradation (danh từ)."},
{q:"Kids should do sport to be healthy.",o:["Children should be encouraged to take part in sport to stay healthy.","Children should be encouraged taking part in sport to stay healthy.","Children should be encouraged to take part on sport to stay healthy."],why:"Cấu trúc là “encourage sb to do sth”, và cụm đúng là “take part in”."},
{q:"There are a lot of reasons for this.",o:["There are several reasons for this trend.","There are several reason for this trend.","There are much reasons for this trend."],why:"“Several” đi với danh từ số nhiều; “much” dùng cho danh từ không đếm được."},
{q:"Old buildings should be kept.",o:["Historic buildings should be preserved for future generations.","Historic buildings should be preserve for future generations.","Historic buildings should preserved for future generation."],why:"Câu bị động cần “be + V3”: should be preserved. “Generations” ở dạng số nhiều."},
{q:"People buy things they don't need.",o:["Consumers often purchase goods they do not really need.","Consumers often purchase goods they are not really need.","Consumers often purchases goods they don't need really."],why:"“Need” là động từ thường nên phủ định bằng “do not”, không dùng “are not”. Chủ ngữ số nhiều nên là “purchase”."},
{q:"The rich get richer and the poor get poorer.",o:["The gap between the rich and the poor is widening.","The gap between rich and poor people is widen.","The gap of the rich and the poor is widening more."],why:"Cụm đúng là “the gap between A and B”. Thì tiếp diễn cần V-ing (widening); “widening more” bị thừa."},
{q:"Cars make the air dirty.",o:["Vehicle emissions are a major cause of air pollution.","Vehicle emissions are a major cause for air pollution.","Vehicle emission is major cause of air pollute."],why:"Collocation đúng là “a cause of + N” (“cause for” dùng trong “cause for concern”). “Pollute” là động từ, danh từ là “pollution”."},
{q:"Working at home is good and bad.",o:["Remote working has both advantages and disadvantages.","Remote working has both advantage and disadvantage.","Remote working have both advantages and disadvantages."],why:"“Both… and…” đi với danh từ số nhiều. “Remote working” là chủ ngữ số ít nên động từ là “has”."},
{q:"Prices went up from 2010 to 2020.",o:["Prices rose steadily between 2010 and 2020.","Prices rose steadily between 2010 to 2020.","Prices were risen steadily from 2010 and 2020."],why:"Các cặp đúng là “between… and…” và “from… to…”. “Rise” là nội động từ nên không dùng ở dạng bị động."},
{q:"Parents should spend time with children.",o:["Parents should spend quality time with their children.","Parents should spend quality time for their children.","Parents should spend quality times with their child."],why:"Cụm đúng là “spend time with sb”. “Quality time” không đếm được; “parents” số nhiều nên dùng “children”."}
);

 {p:"V-(으)세요",t:"hãy … (đề nghị lịch sự)",d:"Dùng để mời, yêu cầu lịch sự. Gốc có patchim thêm 으세요, không có thêm 세요.",ex:[["여기 앉으세요.","Mời ngồi đây."],["김치찌개 하나 주세요.","Cho tôi một canh kimchi."]]}]},
{n:8,ko:"칫솔하고 치약을 삽니다",vn:"Tôi mua bàn chải và kem đánh răng",topic:"Mua sắm",g:[
 {p:"N하고 N",t:"N và N; cùng với N",d:"Nối hai danh từ, dùng nhiều trong văn nói. Cũng dùng với nghĩa “cùng với”: 친구하고 같이.",ex:[["칫솔하고 치약을 사요.","Tôi mua bàn chải và kem đánh răng."],["친구하고 같이 시장에 가요.","Tôi đi chợ cùng bạn."]]},
 {p:"V/A-습니다/ㅂ니다, -습니까/ㅂ니까?",t:"đuôi câu trang trọng",d:"Dùng ở nơi trang trọng (thông báo, phát biểu, công việc). Gốc có patchim thêm 습니다, không có thêm ㅂ니다. Câu hỏi: 습니까/ㅂ니까?",ex:[["감사합니다.","Xin cảm ơn."],["사과가 얼마입니까?","Táo bao nhiêu tiền ạ?"],["저는 매일 운동합니다.","Tôi tập thể dục mỗi ngày."]]}]},
{n:9,ko:"지난 주말에 친구를 만났어요",vn:"Cuối tuần trước tôi đã gặp bạn",topic:"Cuối tuần",g:[
 {p:"V/A-았/었-",t:"thì quá khứ",d:"Theo quy tắc giống -아요/어요: ㅏ, ㅗ thêm 았어요; nguyên âm khác thêm 었어요; 하다 thành 했어요.",ex:[["어제 친구를 만났어요.","Hôm qua tôi đã gặp bạn."],["점심을 먹었어요.","Tôi đã ăn trưa."],["주말에 청소했어요.","Cuối tuần tôi đã dọn dẹp."]]},
 {p:"N도",t:"cũng",d:"Gắn sau danh từ với nghĩa “cũng”. 도 thay thế cho 은/는, 이/가, 을/를.",ex:[["저도 베트남 사람이에요.","Tôi cũng là người Việt Nam."],["커피도 마셔요.","Tôi cũng uống cà phê."]]}]},
{n:10,ko:"아버지는 요리를 잘하세요",vn:"Bố tôi nấu ăn giỏi",topic:"Gia đình",g:[
 {p:"V/A-(으)시-",t:"kính ngữ chủ thể",d:"Thể hiện sự tôn trọng người làm hành động (bố mẹ, ông bà, người lớn tuổi). Một số từ đặc biệt: 먹다 → 드시다/잡수시다, 자다 → 주무시다, 있다 → 계시다.",ex:[["아버지는 요리를 잘하세요.","Bố tôi nấu ăn giỏi."],["할머니께서 주무세요.","Bà đang ngủ."],["선생님, 뭐 드세요?","Thầy ơi, thầy dùng gì ạ?"]]},
 {p:"V/A-지만",t:"nhưng",d:"Nối hai vế trái ngược nhau.",ex:[["한국어는 어렵지만 재미있어요.","Tiếng Hàn khó nhưng thú vị."],["이 옷은 예쁘지만 비싸요.","Áo này đẹp nhưng đắt."]]}]},
{n:11,ko:"어버이날에 부모님께 꽃을 드려요",vn:"Ngày Cha mẹ tôi tặng hoa cho bố mẹ",topic:"Ngày đặc biệt",g:[
 {p:"N에게/한테/께",t:"cho / tới (người)",d:"Chỉ người nhận. 에게 dùng nhiều trong văn viết, 한테 trong văn nói, 께 là kính ngữ (đi với 드리다).",ex:[["친구에게 선물을 줬어요.","Tôi đã tặng quà cho bạn."],["동생한테 전화했어요.","Tôi đã gọi cho em."],["부모님께 꽃을 드려요.","Tôi tặng hoa cho bố mẹ."]]},
 {p:"V-아/어 주다",t:"làm gì cho ai",d:"Làm việc gì đó vì người khác. Nhờ ai làm giúp: -아/어 주세요. Làm cho người trên: -아/어 드리다.",ex:[["사진 좀 찍어 주세요.","Chụp ảnh giúp tôi với."],["친구가 숙제를 도와줬어요.","Bạn đã giúp tôi làm bài tập."]]}]},
{n:12,ko:"이번 휴가에 뭐 할 거예요?",vn:"Kỳ nghỉ này bạn sẽ làm gì?",topic:"Kế hoạch nghỉ",g:[
 {p:"V-(으)ㄹ 거예요",t:"sẽ (dự định)",d:"Nói về kế hoạch hoặc dự định. Gốc có patchim thêm 을 거예요, không có thêm ㄹ 거예요.",ex:[["이번 휴가에 부산에 갈 거예요.","Kỳ nghỉ này tôi sẽ đi Busan."],["주말에 뭐 할 거예요?","Cuối tuần bạn sẽ làm gì?"],["친구하고 점심을 먹을 거예요.","Tôi sẽ ăn trưa với bạn."]]},
 {p:"V/A-고 (liệt kê)",t:"và (nối hai hành động, tính chất)",d:"Nối hai vế ngang hàng. Thì quá khứ thường chỉ đặt ở vế cuối.",ex:[["주말에 청소하고 빨래해요.","Cuối tuần tôi dọn dẹp và giặt đồ."],["이 식당은 싸고 맛있어요.","Quán này rẻ và ngon."]]}]},
{n:13,ko:"버스로 공항에 가요",vn:"Tôi đi sân bay bằng xe buýt",topic:"Giao thông",g:[
 {p:"N(으)로 (phương tiện)",t:"bằng N",d:"Chỉ phương tiện, công cụ. Danh từ có patchim (trừ ㄹ) dùng 으로; không có patchim hoặc tận cùng ㄹ dùng 로.",ex:[["버스로 공항에 가요.","Tôi đi sân bay bằng xe buýt."],["지하철로 와요.","Tôi đến bằng tàu điện ngầm."]]},
 {p:"V-(으)러 가다/오다",t:"đi / đến để làm gì",d:"Chỉ mục đích của việc đi hoặc đến. Gốc có patchim (trừ ㄹ) thêm 으러, còn lại thêm 러.",ex:[["밥을 먹으러 가요.","Tôi đi ăn cơm."],["한국어를 배우러 한국에 왔어요.","Tôi đến Hàn Quốc để học tiếng Hàn."]]}]},
{n:14,ko:"저녁 7시에 만날까요?",vn:"Mình gặp lúc 7 giờ tối nhé?",topic:"Hẹn gặp",g:[
 {p:"V-(으)ㄹ까요?",t:"… nhé? (rủ rê, hỏi ý kiến)",d:"Dùng để rủ người nghe cùng làm hoặc hỏi ý kiến họ. Trả lời đồng ý: -아요/어요 hoặc -(으)ㅂ시다.",ex:[["같이 영화를 볼까요?","Mình cùng xem phim nhé?"],["몇 시에 만날까요?","Mình gặp lúc mấy giờ?"],["네, 좋아요. 같이 가요.","Ừ, được đấy. Đi cùng nhau nhé."]]},
 {p:"못 V",t:"không thể",d:"Không làm được vì lý do khách quan hoặc không có khả năng (khác với 안 là không muốn, không làm). Với N하다: 운동 못 해요.",ex:[["오늘은 바빠서 못 가요.","Hôm nay bận nên tôi không đi được."],["저는 수영을 못 해요.","Tôi không biết bơi."]]}]},
{n:15,ko:"오늘 날씨가 정말 덥네요",vn:"Hôm nay trời nóng thật",topic:"Thời tiết",g:[
 {p:"V/A-네요",t:"… thật đấy (cảm thán)",d:"Bày tỏ sự ngạc nhiên hoặc cảm nhận khi vừa thấy, vừa biết điều gì.",ex:[["날씨가 정말 덥네요.","Trời nóng thật đấy."],["한국어를 잘하시네요.","Bạn nói tiếng Hàn giỏi quá."]]},
 {p:"N보다",t:"so với N, hơn N",d:"Dùng khi so sánh: A이/가 B보다 [tính từ]. Thường thêm 더 (hơn) để nhấn mạnh.",ex:[["오늘이 어제보다 추워요.","Hôm nay lạnh hơn hôm qua."],["지하철이 버스보다 더 빨라요.","Tàu điện ngầm nhanh hơn xe buýt."]]}]},
{n:16,ko:"배가 아파서 병원에 가요",vn:"Tôi đau bụng nên đi bệnh viện",topic:"Bệnh viện",g:[
 {p:"V/A-아서/어서",t:"vì … nên …",d:"Chỉ lý do. Không dùng thì quá khứ trước -아서/어서, và vế sau không được là câu mệnh lệnh hay rủ rê.",ex:[["배가 아파서 병원에 가요.","Tôi đau bụng nên đi bệnh viện."],["어제 늦게 자서 피곤해요.","Hôm qua ngủ muộn nên tôi mệt."]]},
 {p:"V-는 것",t:"việc …",d:"Biến động từ thành danh từ để làm chủ ngữ hoặc tân ngữ. Văn nói thường rút gọn: -는 거.",ex:[["제 취미는 책을 읽는 것이에요.","Sở thích của tôi là đọc sách."],["저는 운동하는 것을 좋아해요.","Tôi thích tập thể dục."]]}]},
{n:17,ko:"사진을 찍지 마세요",vn:"Đừng chụp ảnh",topic:"Nơi công cộng",g:[
 {p:"N(으)로 (phương hướng)",t:"về phía N",d:"Chỉ hướng di chuyển. Quy tắc gắn giống 으로/로 chỉ phương tiện.",ex:[["오른쪽으로 가세요.","Hãy đi về bên phải."],["2층으로 올라가세요.","Hãy lên tầng 2."]]},
 {p:"V-지 마세요",t:"đừng …",d:"Cấm hoặc khuyên không nên làm, lịch sự.",ex:[["여기에서 사진을 찍지 마세요.","Đừng chụp ảnh ở đây."],["잔디밭에 들어가지 마세요.","Đừng đi vào bãi cỏ."]]}]},
{n:18,ko:"한국 생활은 조금 힘든데 재미있어요",vn:"Cuộc sống ở Hàn hơi vất vả nhưng thú vị",topic:"Cuộc sống ở Hàn Quốc",g:[
 {p:"V/A-지요?",t:"… phải không? (xác nhận)",d:"Hỏi lại để xác nhận điều người nói nghĩ là người nghe cũng biết. Văn nói thường rút gọn thành -죠?",ex:[["한국 생활이 힘들지요?","Cuộc sống ở Hàn vất vả nhỉ?"],["내일 시험이 있죠?","Mai có kỳ thi phải không?"]]},
 {p:"V-는데 / A-(으)ㄴ데 (đối lập)",t:"… nhưng …",d:"Nối hai vế tương phản, mềm hơn -지만. Động từ và 있다/없다 dùng -는데; tính từ dùng -(으)ㄴ데.",ex:[["한국어는 어려운데 재미있어요.","Tiếng Hàn khó nhưng thú vị."],["형은 키가 큰데 저는 작아요.","Anh tôi cao nhưng tôi thì thấp."],["비가 오는데 우산이 없어요.","Trời mưa mà tôi không có ô."]]}]}

<script>
(function(){
'use strict';
const MINE='Từ của tôi', LSKEY='sotu-han-anh-v1', MIN=6e4, HOUR=36e5, DAY=864e5;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[\s.,!?'"’‘“”`~\-–—()…:;]/g,'');
const strip=s=>String(s||'').replace(/[\[\]]/g,'');
const surface=c=>{const m=String(c.ex||'').match(/\[(.+?)\]/);return m?m[1]:c.w};
const hl=s=>esc(s).replace(/\[(.+?)\]/g,'<b class="hl">$1</b>');
const blankOut=s=>esc(s).replace(/\[(.+?)\]/g,'<span class="blank">___</span>');
const LNAME={ko:'tiếng Hàn',en:'tiếng Anh'};
const ICON_SAY='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn=(text,cls='')=>`<button class="say ${cls}" type="button" data-say="${esc(strip(text))}" aria-label="Nghe phát âm">${ICON_SAY}</button>`;

/* ---------- State ---------- */
function fresh(){return{lang:'ko',settings:{newPerDay:15,dir:'fwd',autoplay:true,rate:1},cards:{ko:{},en:{}},custom:{ko:[],en:[]},tomb:[],days:{},reset:{ko:0,en:0},sAt:0,updatedAt:0}}
function hydrate(o){
  const d=fresh(); if(!o||typeof o!=='object') return d;
  return Object.assign(d,o,{
    settings:Object.assign(d.settings,o.settings||{}),
    cards:{ko:Object.assign({},(o.cards||{}).ko),en:Object.assign({},(o.cards||{}).en)},
    custom:{ko:[...((o.custom||{}).ko||[])],en:[...((o.custom||{}).en||[])]},
    tomb:[...(o.tomb||[])], days:Object.assign({},o.days||{}),
    reset:Object.assign({ko:0,en:0},o.reset||{})
  });
}
let S=(()=>{try{return hydrate(JSON.parse(localStorage.getItem(LSKEY)))}catch(e){return fresh()}})();
function persistLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();const ks=Object.keys(S.days).sort();while(ks.length>120)delete S.days[ks.shift()];persistLocal();queuePush()}

const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const endOfDay=()=>{const d=new Date();d.setHours(23,59,59,999);return+d};
const todayPeek=L=>((S.days[dkey()]||{})[L])||{n:0,r:0};
function todayStat(L){const k=dkey();S.days[k]=S.days[k]||{};S.days[k][L]=S.days[k][L]||{n:0,r:0};return S.days[k][L]}
function streak(){
  const has=k=>{const x=S.days[k];return!!x&&Object.values(x).some(v=>(v.n||0)+(v.r||0)>0)};
  const d=new Date();let n=0;if(!has(dkey(d)))d.setDate(d.getDate()-1);
  while(has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n;
}

/* ---------- Decks ---------- */
const DECKS={};
function buildDeck(L){
  const out=[];
  (L==='ko'?KO:EN).forEach(tp=>tp.w.forEach(a=>out.push(L==='ko'
    ?{id:'ko:'+a[0],w:a[0],m:a[1],hv:a[2],ex:a[3],exv:a[4],topic:tp.t}
    :{id:'en:'+a[0],w:a[0],pos:a[1],m:a[2],note:a[3],ex:a[4],exv:a[5],topic:tp.t})));
  if(L==='ko'&&typeof KIIP_WORDS!=='undefined'){
    const have=new Set(out.map(c=>c.id));
    for(let n=1;n<=18;n++)BOOK[n]=[];
    for(const [ch,w,m,hv,id] of KIIP_WORDS){
      BOOK[ch].push(id);
      if(!have.has(id)){have.add(id);out.push({id,w,m,hv,ex:'',exv:'',topic:'KIIP Bài '+ch,book:ch})}
    }
  }
  S.custom[L].filter(c=>!S.tomb.includes(c.id)).forEach(c=>out.push(Object.assign({},c,{topic:MINE,custom:true})));
  return out;
}
const BOOK={},BYID={ko:new Map(),en:new Map()};
function rebuildDecks(){DECKS.ko=buildDeck('ko');DECKS.en=buildDeck('en');for(const L of ['ko','en']){BYID[L]=new Map(DECKS[L].map(c=>[c.id,c]))}}
const topicsOf=L=>[...new Set(DECKS[L].map(c=>c.topic))];
const UI={scope:null,topic:{ko:'all',en:'all'},qtype:{ko:'meaning',en:'meaning'},ltype:'lchoose',addOpen:false,search:'',status:'all'};
const topicKey=L=>(L==='ko'&&UI.scope)?'scope:'+UI.scope.label:UI.topic[L];
function setScope(ids,label){UI.scope={ids:new Set(ids),order:ids,label};R.built=false;QS.quiz=QS.listen=null}
function filtered(L){if(L==='ko'&&UI.scope)return UI.scope.order.map(id=>BYID.ko.get(id)).filter(Boolean);const t=UI.topic[L];if(t!=='all'&&!topicsOf(L).includes(t))UI.topic[L]='all';return UI.topic[L]==='all'?DECKS[L]:DECKS[L].filter(c=>c.topic===UI.topic[L])}
const rec=(L,c)=>S.cards[L][c.id];
const statusOf=r=>!r?'new':r.i>=7?'known':'learning';
const STATUS_VN={new:'Mới',learning:'Đang học',known:'Đã nhớ'};
const isDue=(r,now,eod)=>r.i<1?r.d<=now+20*MIN:r.d<=eod;

/* ---------- SRS ---------- */
function schedule(old,g,now){
  const r=old?Object.assign({},old):{i:0,e:2.5,n:0,l:0};
  if(r.i<1){
    if(g===0){r.i=0;r.d=now+MIN}
    else if(g===1){r.i=0;r.d=now+6*MIN}
    else if(g===2){r.i=1;r.d=now+DAY}
    else{r.i=4;r.e+=0.15;r.d=now+4*DAY}
  }else{
    if(g===0){r.l=(r.l||0)+1;r.e=Math.max(1.3,r.e-0.2);r.i=0;r.d=now+10*MIN}
    else if(g===1){r.e=Math.max(1.3,r.e-0.15);r.i=Math.max(1,r.i*1.2);r.d=now+r.i*DAY}
    else if(g===2){r.i=r.i*r.e;r.d=now+r.i*DAY}
    else{r.e+=0.15;r.i=r.i*r.e*1.3;r.d=now+r.i*DAY}
  }
  r.i=Math.round(r.i*100)/100;r.e=Math.round(r.e*100)/100;r.n=(r.n||0)+1;r.t=now;return r;
}
function fmtIvl(ms){
  const m=ms/MIN;if(m<60)return Math.max(1,Math.round(m))+' phút';
  const h=ms/HOUR;if(h<22)return Math.round(h)+' giờ';
  const d=ms/DAY;if(d<30)return Math.max(1,Math.round(d))+' ngày';
  if(d<365)return String(Math.round(d/3)/10).replace('.',',')+' tháng';
  return String(Math.round(d/36.5)/10).replace('.',',')+' năm';
}

/* ---------- Speech ---------- */
const HAS_TTS='speechSynthesis' in window;
let VOICES=[];
function loadVoices(){if(HAS_TTS){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}}
if(HAS_TTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices();if(VIEW==='settings')renderVoiceInfo()})}catch(e){speechSynthesis.onvoiceschanged=loadVoices}}
let VPREF=(()=>{try{return JSON.parse(localStorage.getItem('sotu-voice'))||{}}catch(e){return{}}})();
function saveVPref(){try{localStorage.setItem('sotu-voice',JSON.stringify(VPREF))}catch(e){}}
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical/i;
const GOOD_RE=/natural|neural|premium|enhanced|google|nâng cao|cao cấp/i;
function voiceScore(v,L){
  const lg=String(v.lang||'').toLowerCase().replace('_','-'),n=String(v.name||'');
  if(!lg.startsWith(L==='ko'?'ko':'en'))return -1;
  let s=10;
  if(L==='en'){if(lg==='en-gb')s+=8;else if(lg==='en-us')s+=6;else if(/en-(au|ie|ca|nz)/.test(lg))s+=4}
  if(/natural|neural/i.test(n))s+=60;
  if(/online/i.test(n))s+=15;
  if(/premium|cao cấp/i.test(n))s+=50;
  if(/enhanced|nâng cao/i.test(n))s+=40;
  if(/google/i.test(n))s+=30;
  if(v.localService===false)s+=5;
  if(/compact|espeak|eloquence/i.test(n))s-=20;
  if(NOVELTY.test(n))s-=100;
  return s;
}
function voicesFor(L){return VOICES.map(v=>({v,s:voiceScore(v,L)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.v)}
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const sysMode=L=>VPREF[L]==='__system__'||(!VPREF[L]&&IS_IOS);
function voiceFor(L){if(sysMode(L))return null;const list=voicesFor(L);if(!list.length)return null;const p=VPREF[L];if(p){const f=list.find(v=>v.voiceURI===p);if(f)return f}return list[0]}
const voiceIsGood=v=>!!v&&GOOD_RE.test(v.name);
function speak(text,L,rate){
  if(!HAS_TTS||!text)return;L=L||S.lang;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(strip(text)),v=voiceFor(L);
    u.lang=v?v.lang:(L==='ko'?'ko-KR':'en-GB');if(v)u.voice=v;
    u.rate=rate||S.settings.rate;u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say,b.dataset.lang,b.dataset.slow?0.6:0)});

/* ---------- Sync (claude db, per-person private) ---------- */
const SY={ref:null,timer:null,retry:0};
const SYNC_TXT={local:'Lưu trên máy này',ok:'Đã đồng bộ',saving:'Đang lưu…',err:'Chưa đồng bộ được',offline:'Ngoại tuyến'};
function setSync(s){const el=$('#sync');el.dataset.s=s;$('span',el).textContent=SYNC_TXT[s];SY.state=s}
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();if(!id){setSync('local');return}
    SY.ref=db.collection('data/users/'+id).doc('state');
    await pull();
  }catch(e){setSync('local')}
}
async function pull(){
  if(!SY.ref)return;
  try{
    const snap=await SY.ref.get();
    if(snap.exists){const d=snap.data();if(d&&typeof d.s==='string'){if(mergeIn(hydrate(JSON.parse(d.s)))){persistLocal();rebuildDecks();afterRemote()}}}
    await push();
  }catch(e){setSync('err')}
}
function queuePush(){queueGist();if(!SY.ref)return;clearTimeout(SY.timer);setSync('saving');SY.timer=setTimeout(push,1500)}
async function push(){
  if(!SY.ref)return;
  try{await SY.ref.set({s:JSON.stringify(S),at:Date.now()});SY.retry=0;setSync('ok')}
  catch(e){if(e&&e.code==='unavailable'&&SY.retry<2){SY.retry++;setTimeout(push,1500+Math.random()*2500)}else setSync('err')}
}
function mergeIn(r){
  let ch=false;
  for(const L of ['ko','en']){
    const rs=Math.max(S.reset[L]||0,(r.reset||{})[L]||0);
    if(rs>(S.reset[L]||0)){S.reset[L]=rs;for(const k in S.cards[L])if((S.cards[L][k].t||0)<rs){delete S.cards[L][k];ch=true}}
    const a=S.cards[L],b=r.cards[L];
    for(const k in b){const y=b[k];if((y.t||0)<rs)continue;if(!a[k]||(y.t||0)>(a[k].t||0)){a[k]=y;ch=true}}
    const ids=new Set(S.custom[L].map(c=>c.id));
    for(const c of r.custom[L])if(!ids.has(c.id)){S.custom[L].push(c);ch=true}
  }
  for(const t of r.tomb)if(!S.tomb.includes(t)){S.tomb.push(t);ch=true}
  for(const d in r.days){S.days[d]=S.days[d]||{};for(const L in r.days[d]){const x=S.days[d][L]||{n:0,r:0},y=r.days[d][L]||{};const n=Math.max(x.n||0,y.n||0),rr=Math.max(x.r||0,y.r||0);if(n!==x.n||rr!==x.r||!S.days[d][L]){S.days[d][L]={n,r:rr};ch=true}}}
  if((r.sAt||0)>(S.sAt||0)){S.settings=Object.assign(S.settings,r.settings);S.lang=r.lang||S.lang;S.sAt=r.sAt;ch=true}
  return ch;
}
function afterRemote(){
  renderHeader();
  if(VIEW==='review'){if(!R.cur||!R.flipped){R.built=false;renderView()}else R.stale=true}
  else{R.built=false;if(VIEW==='list'||VIEW==='settings')renderView()}
}
/* ---------- Sync qua GitHub Gist (cho bản tự đăng lên github.io) ---------- */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const GKEY='sotu-gist',GFILE='sotu-progress.json';
let GS=(()=>{try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return{}}})();
function saveGS(){try{localStorage.setItem(GKEY,JSON.stringify(GS))}catch(e){}}
const gistOn=()=>!IN_CLAUDE&&!!GS.token&&!!GS.id;
async function gh(path,opt){
  opt=opt||{};
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+GS.token};
  if(opt.body)headers['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers,cache:'no-store'}));
  if(!r.ok){const e=new Error('github '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
function ghErr(e){
  if(e&&e.status===401)return 'Token không hợp lệ hoặc đã hết hạn. Hãy tạo token mới rồi kết nối lại.';
  if(e&&e.status===404)return 'Token chưa có quyền gist, hoặc không tìm thấy gist. Hãy tạo token có chọn quyền gist.';
  if(e&&(e.status===403||e.status===429))return 'GitHub đang tạm giới hạn lượt truy cập. Thử lại sau ít phút.';
  return 'Không kết nối được tới GitHub. Hãy kiểm tra mạng.';
}
async function gistRead(){
  const g=await gh('/gists/'+GS.id);
  const f=g&&g.files&&g.files[GFILE];if(!f)return{raw:'',data:null};
  let raw=f.content||'';
  if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:'no-store'});raw=await r.text()}
  try{return{raw,data:JSON.parse(raw)}}catch(e){return{raw,data:null}}
}
let gBusy=false,gAgain=false,gTimer=null;
async function gistSync(){
  if(!gistOn())return;
  if(gBusy){gAgain=true;return}
  gBusy=true;clearTimeout(gTimer);gTimer=null;setSync('saving');
  try{
    const rem=await gistRead();
    if(rem.data&&mergeIn(hydrate(rem.data))){persistLocal();rebuildDecks();afterRemote()}
    const out=JSON.stringify(S);
    if(out!==rem.raw)await gh('/gists/'+GS.id,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:out}}})});
    GS.last=Date.now();GS.err='';GS.dirty=false;saveGS();setSync('ok');
  }catch(e){if(!navigator.onLine){GS.err='';GS.dirty=true;saveGS();setSync('offline')}else{GS.err=ghErr(e);saveGS();setSync('err')}}
  finally{gBusy=false;if(VIEW==='settings')renderSyncBox();if(gAgain){gAgain=false;setTimeout(gistSync,400)}}
}
async function gistConnect(token){
  GS={token:token.trim()};
  const u=await gh('/user');GS.login=u&&u.login;
  let id=null;
  for(let p=1;p<=5&&!id;p++){const list=await gh('/gists?per_page=100&page='+p);if(!list||!list.length)break;const f=list.find(g=>g.files&&g.files[GFILE]);if(f)id=f.id}
  if(!id){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Sổ từ vựng Hàn – Anh: tiến độ học',public:false,files:{[GFILE]:{content:JSON.stringify(S)}}})});id=g.id}
  GS.id=id;saveGS();
  await gistSync();
}
function queueGist(){if(!gistOn())return;clearTimeout(gTimer);if(!navigator.onLine){setSync('offline');GS.dirty=true;saveGS();return}setSync('saving');gTimer=setTimeout(gistSync,3000)}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){pull();if(gistOn()&&(!GS.last||Date.now()-GS.last>15000))gistSync()}
  else if(gTimer)gistSync();
});
window.addEventListener('online',()=>{if(gistOn())gistSync()});
window.addEventListener('offline',()=>{if(gistOn())setSync('offline')});

/* ---------- Shell ---------- */
let VIEW='review';
function renderHeader(){
  const L=S.lang,now=Date.now(),eod=endOfDay();
  let due=0,known=0;
  for(const c of DECKS[L]){const r=rec(L,c);if(!r)continue;if(isDue(r,now,eod))due++;if(r.i>=7)known++}
  const newLeft=Math.max(0,S.settings.newPerDay-todayPeek(L).n);
  $('#stats').innerHTML=`<div class="stat due"><b>${due}</b><span>cần ôn</span></div><div class="stat"><b>${newLeft}</b><span>từ mới còn lại</span></div><div class="stat"><b>${streak()}</b><span>ngày liên tiếp</span></div><div class="stat"><b>${known}<em class="of">/${DECKS[L].length}</em></b><span>đã nhớ</span></div>`;
}
function render(){
  if(VIEW==='book'&&S.lang!=='ko')VIEW='review';
  $('.tabs [data-v="book"]').hidden=S.lang!=='ko';
  document.body.dataset.lang=S.lang;
  document.title=S.lang==='ko'?'Sổ từ vựng · 한국어':'Sổ từ vựng · IELTS';
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===S.lang)));
  $$('.tabs button').forEach(b=>b.dataset.v===VIEW?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  renderHeader();renderView();
}
function renderView(){({review:viewReview,quiz:viewQuiz,listen:viewQuiz,book:viewBook,list:viewList,settings:viewSettings})[VIEW]()}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{if(S.lang===b.dataset.l)return;S.lang=b.dataset.l;S.sAt=Date.now();R.built=false;save();if(HAS_TTS)speechSynthesis.cancel();render();window.scrollTo(0,0)}));
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>{VIEW=b.dataset.v;if(HAS_TTS)speechSynthesis.cancel();render();window.scrollTo(0,0)}));
$('#sync').addEventListener('click',()=>{if(SY.ref)pull();else if(gistOn())gistSync();else{VIEW='settings';render();const el=$('#syncSec');if(el)el.scrollIntoView()}});

function topicSelect(L){
  if(L==='ko'&&UI.scope)return `<div class="scopebar"><span>Theo sách: ${esc(UI.scope.label.replace(/^Sách: /,''))}</span><button class="linkbtn" id="scopeExit" type="button">Bỏ lọc</button></div>`;
  const ts=topicsOf(L),cur=UI.topic[L];
  return `<label class="tsel"><span>Chủ đề</span><select class="sel" id="topicSel"><option value="all">Tất cả chủ đề (${DECKS[L].length})</option>${ts.map(t=>`<option value="${esc(t)}"${cur===t?' selected':''}>${esc(t)} (${DECKS[L].filter(c=>c.topic===t).length})</option>`).join('')}</select></label>`;
}
function bindTopic(after){const x=$('#scopeExit');if(x)x.addEventListener('click',()=>{UI.scope=null;R.built=false;QS.quiz=QS.listen=null;after()});const s=$('#topicSel');if(s)s.addEventListener('change',()=>{UI.topic[S.lang]=s.value;after()})}

/* ---------- Review ---------- */
const R={queue:[],cur:null,flipped:false,extra:0,built:false,lang:null,topic:null};
function buildQueue(){
  const L=S.lang,deck=filtered(L),now=Date.now(),eod=endOfDay();
  const due=deck.filter(c=>{const r=rec(L,c);return r&&isDue(r,now,eod)}).sort((a,b)=>rec(L,a).d-rec(L,b).d);
  const left=Math.max(0,S.settings.newPerDay+R.extra-todayPeek(L).n);
  const fresh=deck.filter(c=>!rec(L,c)).slice(0,left);
  const q=[];let i=0,j=0;
  while(i<due.length||j<fresh.length){for(let k=0;k<3&&i<due.length;k++)q.push(due[i++]);if(j<fresh.length)q.push(fresh[j++])}
  R.queue=q;R.cur=q.shift()||null;R.flipped=false;R.built=true;R.lang=L;R.topic=topicKey(L);
}
function counts(){const L=S.lang;let n=0,l=0,r=0;for(const c of [R.cur,...R.queue]){if(!c)continue;const x=rec(L,c);if(!x)n++;else if(x.i<1)l++;else r++}return{n,l,r}}
function wordVisual(c,L){
  if(L==='ko'){const ch=[...c.w];return `<div class="grid${ch.length>6?' long':''}" lang="ko" aria-label="${esc(c.w)}">${ch.map(x=>x===' '?'<span class="cell sp"></span>':`<span class="cell" aria-hidden="true">${esc(x)}</span>`).join('')}</div>`}
  return `<div class="sheet" lang="en"><span class="eword">${esc(c.w)}</span>${c.pos?`<span class="pos">${esc(c.pos)}</span>`:''}</div>`;
}
function metaLine(c,L){
  if(L==='ko'&&c.hv){const loan=/^từ mượn/i.test(c.hv);return `<div class="meta"><span>${loan?'Gốc từ':'Hán-Việt'}</span>${esc(loan?c.hv.replace(/^từ mượn:?\s*/i,''):c.hv)}</div>`}
  if(L==='en'&&c.note)return `<div class="meta"><span>Collocation</span>${esc(c.note)}</div>`;
  return '';
}
function exBlock(c,L){
  if(!c.ex)return '';
  return `<div class="ex"><p lang="${L}">${hl(c.ex)}</p>${sayBtn(c.ex,'sm')}</div>${c.exv?`<p class="exv">${esc(c.exv)}</p>`:''}`;
}
function viewReview(){
  const L=S.lang,v=$('#view');
  if(!R.built||R.lang!==L||R.topic!==topicKey(L)||!R.cur)buildQueue();
  const tb=`<div class="toolbar">${topicSelect(L)}</div>`;
  if(!R.cur){
    const deck=filtered(L),now=Date.now();
    const remainNew=deck.filter(c=>!rec(L,c)).length;
    const next=deck.map(c=>rec(L,c)).filter(r=>r&&r.d>now).reduce((m,r)=>Math.min(m,r.d),Infinity);
    const t=todayPeek(L);
    const art=L==='ko'?wordVisual({w:'잘했어요'},'ko'):`<div class="sheet"><span class="eword">Well done</span></div>`;
    v.innerHTML=tb+`<div class="card done">${art}<h2>${t.n+t.r?'Xong phần hôm nay':'Chưa có thẻ nào đến hạn'}</h2>
      <p class="muted">${t.n+t.r?`Hôm nay bạn đã học ${t.n} từ mới và ôn ${t.r} lượt. `:''}${next<Infinity?`Thẻ tiếp theo đến hạn sau ${fmtIvl(next-now)}.`:''}${remainNew?'':' Bạn đã học hết từ trong chủ đề này.'}</p>
      <div class="btns">${remainNew?`<button class="btn" id="more">Học thêm ${Math.min(10,remainNew)} từ mới</button>`:''}<button class="btn ghost" id="goQuiz">Làm bài kiểm tra</button></div></div>`;
    bindTopic(()=>{R.built=false;viewReview()});
    const m=$('#more');if(m)m.addEventListener('click',()=>{R.extra+=10;R.built=false;viewReview()});
    $('#goQuiz').addEventListener('click',()=>{VIEW='quiz';render()});
    return;
  }
  const c=R.cur,dir=S.settings.dir,k=counts(),r=rec(L,c),now=Date.now();
  const front=dir==='fwd'
    ?`${wordVisual(c,L)}${sayBtn(c.w)}`
    :`<div class="vn-front">${esc(c.m)}</div><p class="hint">Từ ${LNAME[L]} là gì?</p>`;
  let back='';
  if(R.flipped){
    back=`<div class="back">${dir==='rev'?`<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${wordVisual(c,L)}${sayBtn(c.w)}</div>`:`<div class="meaning">${esc(c.m)}</div>`}${metaLine(c,L)}${exBlock(c,L)}</div>`;
  }
  const actions=R.flipped
    ?`<div class="grades" role="group" aria-label="Bạn nhớ từ này thế nào?">${['Quên','Khó','Được','Dễ'].map((t,g)=>`<button class="g${g}" data-g="${g}">${t}<small>${fmtIvl(schedule(r,g,now).d-now)}</small></button>`).join('')}</div>`
    :`<button class="btn" id="flip">Lật thẻ <kbd>Space</kbd></button>`;
  v.innerHTML=tb+`<div class="counts"><span class="c-new"><b>${k.n}</b>mới</span><span class="c-learn"><b>${k.l}</b>đang học</span><span class="c-rev"><b>${k.r}</b>ôn lại</span></div>
    <article class="card"><div class="topicline"><span>${esc(c.topic)}</span><span>${r?STATUS_VN[statusOf(r)]:'Từ mới'}</span></div><div class="front">${front}</div>${back}</article>${actions}`;
  bindTopic(()=>{R.built=false;viewReview()});
  const f=$('#flip');if(f)f.addEventListener('click',flip);
  $$('.grades button').forEach(b=>b.addEventListener('click',()=>grade(+b.dataset.g)));
  if(!R.flipped&&dir==='fwd'&&S.settings.autoplay)speak(c.w,L);
}
function flip(){if(!R.cur||R.flipped)return;R.flipped=true;viewReview();if(S.settings.dir==='rev'&&S.settings.autoplay)speak(R.cur.w);const g=$('.grades button.g2');if(g)g.focus({preventScroll:true})}
function grade(g){
  if(!R.cur||!R.flipped)return;
  const L=S.lang,c=R.cur,old=rec(L,c),now=Date.now(),r=schedule(old,g,now);
  S.cards[L][c.id]=r;const ts=todayStat(L);if(old)ts.r++;else ts.n++;
  if(r.d-now<20*MIN)R.queue.splice(Math.min(R.queue.length,3),0,c);
  save();R.cur=R.queue.shift()||null;R.flipped=false;if(R.stale){R.stale=false;R.built=false}renderHeader();viewReview();
}

/* ---------- Quiz & Listening (shared engine) ---------- */
const QS={quiz:null,listen:null};
const QTYPES={
  meaning:{t:'Chọn nghĩa',d:'Xem từ, chọn nghĩa tiếng Việt đúng'},
  word:{t:'Chọn từ',d:'Xem nghĩa tiếng Việt, chọn từ đúng'},
  fill:{t:'Điền từ vào câu',d:'Chọn từ (đúng dạng) để hoàn thành câu ví dụ'},
  para:{t:'Nâng cấp câu IELTS',d:'Chọn cách viết lại tự nhiên, đúng ngữ pháp, hướng tới band 7'}
};
const LTYPES={lchoose:{t:'Nghe và chọn nghĩa',d:'Nghe phát âm rồi chọn nghĩa đúng'},ltype:{t:'Nghe và gõ lại',d:'Nghe rồi gõ lại từ, luyện cả chính tả'}};
function makeItem(kind,c,L){
  if(kind==='ltype')return{kind,card:c};
  const key=kind==='word'?(x=>x.w):kind==='fill'?(x=>x.ex&&/\[.+?\]/.test(x.ex)?surface(x):''):(x=>x.m);
  const correct=key(c),all=DECKS[L];
  const pool=[...shuffle(all.filter(x=>x.topic===c.topic&&x.id!==c.id)),...shuffle(all.filter(x=>x.topic!==c.topic))];
  const opts=[{t:correct,ok:true}],seen=new Set([norm(correct)]);
  for(const x of pool){if(opts.length>=4)break;const v=key(x);if(!v||seen.has(norm(v)))continue;seen.add(norm(v));opts.push({t:v,ok:false})}
  return{kind,card:c,opts:shuffle(opts)};
}
function startRound(view){
  const L=S.lang;let items=[];
  const kind=view==='listen'?UI.ltype:UI.qtype[L];
  if(kind==='para'){items=shuffle(PARA).slice(0,10).map(p=>({kind,prompt:p.q,why:p.why,opts:shuffle(p.o.map((t,i)=>({t,ok:i===0})))}))}
  else{
    let deck=filtered(L);if(kind==='fill')deck=deck.filter(c=>/\[.+?\]/.test(c.ex||''));
    const seen=deck.filter(c=>rec(L,c));
    let picks=shuffle(seen).slice(0,10);
    if(picks.length<10)picks=picks.concat(shuffle(deck.filter(c=>!rec(L,c))).slice(0,10-picks.length));
    items=shuffle(picks).map(c=>makeItem(kind,c,L));
  }
  QS[view]=items.length?{view,lang:L,items,i:0,score:0,wrong:[],answered:false,done:false}:{empty:true,lang:L};
}
function viewQuiz(){
  const view=VIEW,L=S.lang,v=$('#view');let Q=QS[view];
  if(Q&&Q.lang!==L)Q=QS[view]=null;
  const isL=view==='listen';
  if(!Q||Q.empty){
    const types=isL?LTYPES:QTYPES,cur=isL?UI.ltype:UI.qtype[L];
    const keys=Object.keys(types).filter(k=>k!=='para'||L==='en');
    let notice='';
    if(isL){
      if(!HAS_TTS)notice='<div class="notice">Trình duyệt này không hỗ trợ đọc thành tiếng. Hãy mở bằng Chrome, Safari hoặc Edge.</div>';
      else if(!sysMode(L)&&VOICES.length&&!voiceFor(L))notice=`<div class="notice">Thiết bị chưa có giọng đọc ${LNAME[L]}. Xem cách tải giọng trong <button class="linkbtn" data-goset>Cài đặt</button>.</div>`;
      else if(!sysMode(L)&&VOICES.length&&!voiceIsGood(voiceFor(L)))notice=`<div class="notice">Máy đang dùng giọng đọc cơ bản nên nghe chưa tự nhiên. Vào <button class="linkbtn" data-goset>Cài đặt</button> để chọn hoặc tải giọng tốt hơn.</div>`;
    }
    v.innerHTML=`<h2>${isL?'Luyện nghe':'Kiểm tra'}</h2>${notice}
      <div class="types" role="radiogroup">${keys.map(k=>`<button class="type" role="radio" data-k="${k}" aria-pressed="${k===cur}" aria-checked="${k===cur}"><span class="radio"></span><span><b>${types[k].t}</b><small>${types[k].d}</small></span></button>`).join('')}</div>
      ${cur==='para'?'':`<div class="toolbar" style="margin-top:0">${topicSelect(L)}</div>`}
      ${Q&&Q.empty?'<p class="msg no">Chủ đề này chưa có đủ từ cho dạng bài này. Hãy chọn chủ đề khác.</p>':''}
      <p class="muted small">Mỗi lượt 10 câu, ưu tiên những từ bạn đã học. ${isL?'':'Từ trả lời sai sẽ được đưa vào phần ôn thẻ ngay.'}</p>
      <button class="btn" id="startQ">Bắt đầu</button>`;
    $$('[data-goset]').forEach(b=>b.addEventListener('click',()=>{VIEW='settings';render();window.scrollTo(0,0)}));
    $$('.type').forEach(b=>b.addEventListener('click',()=>{if(isL)UI.ltype=b.dataset.k;else UI.qtype[L]=b.dataset.k;QS[view]=null;viewQuiz()}));
    bindTopic(()=>{QS[view]=null;viewQuiz()});
    $('#startQ').addEventListener('click',()=>{startRound(view);viewQuiz();const q=QS[view];if(q&&!q.empty&&q.items[0].kind[0]==='l')speak(q.items[0].card.w,L)});
    return;
  }
  if(Q.done){
    const n=Q.items.length,p=Q.score/n;
    const msg=p>=0.9?'Rất tốt! Bạn nắm chắc nhóm từ này.':p>=0.7?'Khá ổn. Xem lại những câu sai bên dưới nhé.':'Hãy ôn lại các từ bên dưới rồi làm lại.';
    const wrongCards=Q.wrong.filter(it=>it.card);
    v.innerHTML=`<div class="score">${Q.score}<span>/${n}</span></div><p>${msg}</p>
      ${Q.wrong.length?`<h3 style="margin-top:20px">Cần xem lại</h3><ul class="misslist">${Q.wrong.map(it=>it.card?`<li><b class="${L==='ko'?'kr':''}">${esc(it.card.w)}</b><span class="muted">${esc(it.card.m)}</span></li>`:`<li><span>${esc(it.opts.find(o=>o.ok).t)}</span></li>`).join('')}</ul>`:''}
      <div class="btns"><button class="btn" id="again">Làm lượt mới</button>${!isL&&wrongCards.some(it=>rec(L,it.card))?'<button class="btn ghost" id="toReview">Ôn lại từ sai</button>':''}<button class="btn ghost" id="changeType">Đổi dạng bài</button></div>`;
    $('#again').addEventListener('click',()=>{startRound(view);viewQuiz();const q=QS[view];if(q&&!q.empty&&q.items[0].kind[0]==='l')speak(q.items[0].card.w,L)});
    const tr=$('#toReview');if(tr)tr.addEventListener('click',()=>{R.built=false;VIEW='review';render()});
    $('#changeType').addEventListener('click',()=>{QS[view]=null;viewQuiz()});
    return;
  }
  const it=Q.items[Q.i],c=it.card,n=Q.items.length;
  let prompt='';
  if(it.kind==='meaning')prompt=`<p class="ask">Nghĩa của từ này là gì?</p><div class="qword ${L==='ko'?'kr':''}" lang="${L}">${esc(c.w)}${sayBtn(c.w)}</div>${L==='en'&&c.pos?`<p class="hint" style="margin-top:6px"><i>${esc(c.pos)}</i></p>`:''}`;
  else if(it.kind==='word')prompt=`<p class="ask">Từ nào có nghĩa là</p><div class="qmean">${esc(c.m)}</div>`;
  else if(it.kind==='fill')prompt=`<p class="ask">Chọn từ thích hợp cho chỗ trống</p><div class="qsent ${L==='ko'?'kr':''}" lang="${L}">${blankOut(c.ex)}</div>${c.exv?`<p style="text-align:left;margin:10px 0 0"><button class="linkbtn" id="hintBtn">Xem nghĩa của câu</button></p><p class="exv" id="hintTxt" hidden style="text-align:left;margin-top:6px">${esc(c.exv)}</p>`:''}`;
  else if(it.kind==='para')prompt=`<p class="ask">Câu gốc (band 5). Cách viết lại nào tốt nhất?</p><div class="qsent" lang="en">${esc(it.prompt)}</div>`;
  else prompt=`<p class="ask">${it.kind==='lchoose'?'Nghe và chọn nghĩa đúng':'Nghe và gõ lại từ bạn nghe được'}</p><div class="play"><button class="playbtn" type="button" data-say="${esc(c.w)}" aria-label="Phát lại">${ICON_PLAY}</button><button class="linkbtn" type="button" data-say="${esc(c.w)}" data-slow="1">Nghe chậm</button></div>`;
  let answers='';
  if(it.kind==='ltype')answers=`<div class="typed"><input class="inp" id="typed" lang="${L}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${L==='ko'?'Gõ bằng bàn phím tiếng Hàn':'Gõ từ tiếng Anh'}" aria-label="Câu trả lời"><button class="btn" id="checkT">Kiểm tra</button></div>`;
  else{
    const optKr=L==='ko'&&(it.kind==='word'||it.kind==='fill'||false);
    answers=`<div class="opts">${it.opts.map((o,i)=>`<button class="opt ${optKr?'kr':''}" data-i="${i}" ${optKr?'lang="ko"':''}><span class="n">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  }
  v.innerHTML=`<div class="qhead"><span>Câu ${Q.i+1}/${n}</span><span>Đúng ${Q.score}</span></div><div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
    <div class="qcard">${prompt}</div>${answers}<div id="fb"></div>`;
  $$('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
  const hb=$('#hintBtn');if(hb)hb.addEventListener('click',()=>{$('#hintTxt').hidden=false;hb.hidden=true});
  const ti=$('#typed');
  if(ti){
    ti.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();Q.answered?nextQ():checkTyped()}});
    $('#checkT').addEventListener('click',checkTyped);
    if(window.matchMedia('(hover:hover)').matches)ti.focus({preventScroll:true});
  }
}
function feedback(it,ok,typed){
  const L=S.lang,c=it.card,Q=QS[VIEW],last=Q.i===Q.items.length-1;
  let body='';
  if(it.kind==='para')body=`<p>${esc(it.why)}</p>`;
  else body=`<p><b class="${L==='ko'?'kr':''}" lang="${L}" style="font-size:18px">${esc(c.w)}</b> ${sayBtn(c.w,'sm')}</p><p>${esc(c.m)}</p>${metaLine(c,L)}${exBlock(c,L)}`;
  if(typed!=null&&!ok)body=`<p class="muted small">Bạn gõ: ${esc(typed)||'(trống)'}</p>`+body;
  $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><span class="verdict">${ok?'Chính xác':'Chưa đúng'}</span>${body}</div><div class="btns"><button class="btn" id="nextQ">${last?'Xem kết quả':'Câu tiếp theo'} <kbd>Enter</kbd></button></div>`;
  $('#nextQ').addEventListener('click',nextQ);
  if(typed==null)$('#nextQ').focus({preventScroll:true});
  $('#fb').scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
function markResult(it,ok){
  const Q=QS[VIEW],L=S.lang;
  if(ok)Q.score++;
  else{Q.wrong.push(it);if(it.card&&VIEW==='quiz'){const r=rec(L,it.card);if(r){r.d=Date.now();r.t=Date.now();save();renderHeader()}}}
}
function answer(i){
  const Q=QS[VIEW];if(!Q||Q.answered||Q.done)return;const it=Q.items[Q.i];if(!it.opts||!it.opts[i])return;
  Q.answered=true;const ok=it.opts[i].ok;markResult(it,ok);
  $$('.opt').forEach((b,j)=>{b.disabled=true;if(it.opts[j].ok)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  feedback(it,ok,null);
  if(it.kind==='lchoose'||it.kind==='meaning'){}else if(it.card&&S.settings.autoplay)speak(it.card.w);
}
function checkTyped(){
  const Q=QS[VIEW];if(!Q||Q.answered)return;const it=Q.items[Q.i],inp=$('#typed');
  const val=inp.value.trim();const ok=norm(val)===norm(it.card.w);
  Q.answered=true;markResult(it,ok);inp.readOnly=true;$('#checkT').disabled=true;
  inp.style.borderColor=ok?'var(--ok)':'var(--bad)';
  feedback(it,ok,val);
}
function nextQ(){
  const Q=QS[VIEW];if(!Q||!Q.answered)return;
  if(Q.i>=Q.items.length-1){Q.done=true}else{Q.i++;Q.answered=false}
  viewQuiz();window.scrollTo(0,0);
  if(!Q.done){const it=Q.items[Q.i];if(it.kind[0]==='l')speak(it.card.w)}
}

/* ---------- Học theo sách (KIIP) ---------- */
const BK={unit:null};
function bookRange(){const a=S.settings.bookFrom||1,b=S.settings.bookTo||13;return[Math.min(a,b),Math.max(a,b)]}
function unitIds(a,b){const ids=[],seen=new Set();for(let n=a;n<=b;n++)for(const id of BOOK[n]||[])if(!seen.has(id)){seen.add(id);ids.push(id)}return ids}
function unitStats(ids){let k=0,l=0,n=0;for(const id of ids){const s=statusOf(S.cards.ko[id]);if(s==='known')k++;else if(s==='learning')l++;else n++}return{k,l,n,t:ids.length}}
const pagesOf=n=>{const p=n<=9?12+10*(n-1):112+10*(n-10);return[p,p+9]};
const pctOf=s=>s.t?Math.round((s.k+s.l*0.5)/s.t*100):0;
function goScoped(ids,label,view){setScope(ids,label);if(view==='quiz'&&UI.qtype.ko==='fill')UI.qtype.ko='meaning';VIEW=view;render();window.scrollTo(0,0)}
function viewBook(){
  if(typeof KIIP_UNITS==='undefined'){$('#view').innerHTML='<p class="empty">Chưa có dữ liệu sách.</p>';return}
  if(BK.unit)return viewUnit(BK.unit);
  const [a,b]=bookRange(),ids=unitIds(a,b),st=unitStats(ids),v=$('#view');
  const days=Math.ceil(st.n/Math.max(1,S.settings.newPerDay));

  v.innerHTML=`<h2>Học theo sách</h2>

function renderList(){
  const L=S.lang,q=norm(UI.search),now=Date.now();
  const rows=filtered(L).filter(c=>(UI.status==='all'||statusOf(rec(L,c))===UI.status)&&(!q||norm(c.w).includes(q)||norm(c.m).includes(q)));
  $('#wl').innerHTML=rows.length?rows.map(c=>{
    const r=rec(L,c),st=statusOf(r);
    const due=r?(r.d<=now?'Đến hạn ôn':`Ôn lại sau ${fmtIvl(r.d-now)}`):'Chưa học';
    return `<details><summary><span class="w-word ${L==='ko'?'kr':''}" lang="${L}">${esc(c.w)}</span><span class="w-m">${esc(c.m)}</span><span class="tag ${st}">${STATUS_VN[st]}</span></summary>
      <div class="w-body"><div class="ansrow"><div class="meaning" style="font-size:17px">${esc(c.m)}${c.pos?` <span class="pos">${esc(c.pos)}</span>`:''}</div>${sayBtn(c.w,'sm')}</div>${metaLine(c,L)}${exBlock(c,L)}
      <div class="w-foot"><span>${esc(c.topic)}, ${due.charAt(0).toLowerCase()+due.slice(1)}</span>${c.custom?`<button class="linkbtn" data-del="${esc(c.id)}" style="color:var(--bad)">Xóa từ</button>`:''}</div></div></details>`;
  }).join(''):`<p class="empty">Không tìm thấy từ nào. ${UI.search?'Thử từ khóa khác, hoặc thêm từ này vào danh sách của bạn.':''}</p>`;
  $$('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.del;if(!confirm('Xóa từ này khỏi danh sách của bạn?'))return;
    S.tomb.push(id);S.custom[L]=S.custom[L].filter(c=>c.id!==id);delete S.cards[L][id];save();rebuildDecks();R.built=false;renderHeader();viewList();
  }));
}
function addWord(){
  const L=S.lang,val=id=>{const e=$('#f-'+id);return e?e.value.trim():''},msg=$('#addMsg');
  const w=val('w'),m=val('m');
  if(!w||!m){msg.className='msg no';msg.textContent='Hãy nhập cả từ và nghĩa tiếng Việt.';return}
  if(DECKS[L].some(c=>norm(c.w)===norm(w))){msg.className='msg no';msg.textContent='Từ này đã có trong danh sách.';return}
  let ex=val('ex');if(ex&&!/\[.+?\]/.test(ex)){const i=ex.toLowerCase().indexOf(w.toLowerCase());if(i>=0)ex=ex.slice(0,i)+'['+ex.slice(i,i+w.length)+']'+ex.slice(i+w.length)}
  const id=L+':c'+Date.now().toString(36);
  const c=L==='ko'?{id,w,m,hv:val('hv'),ex,exv:val('exv')}:{id,w,pos:val('pos'),m,note:val('note'),ex,exv:val('exv')};
  S.custom[L].push(c);save();rebuildDecks();R.built=false;renderHeader();
  UI.addOpen=true;viewList();
  const mm=$('#addMsg');mm.className='msg ok';mm.textContent=`Đã thêm “${w}”. Từ này sẽ xuất hiện trong phần ôn thẻ, chủ đề “${MINE}”.`;
}

function renderSyncBox(){

      ${!navigator.onLine?'<p class="msg">Đang ngoại tuyến. Bạn vẫn học bình thường, tiến độ sẽ tự đồng bộ khi có mạng.</p>':''}${GS.err?`<p class="msg no">${esc(GS.err)}</p>`:''}

    return;
  }
  box.innerHTML=`<p>Tiến độ đang lưu trên trình duyệt của máy này. Kết nối với GitHub Gist để đồng bộ giữa điện thoại và máy tính.</p>
    <ol class="gsteps">
      <li>Bấm <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=So%20tu%20vung" target="_blank" rel="noopener">tạo token trên GitHub</a>. Trang mở ra đã chọn sẵn quyền <b>gist</b>.</li>
      <li>Ở mục Expiration, chọn thời hạn (ví dụ 1 năm), rồi kéo xuống cuối trang bấm <b>Generate token</b>.</li>
      <li>Sao chép mã bắt đầu bằng <code>ghp_</code>, dán vào ô dưới đây rồi bấm Kết nối.</li>
      <li>Trên máy còn lại, mở trang và dán cùng mã đó. Hãy lưu mã vào ghi chú riêng, vì GitHub chỉ hiện mã một lần.</li>
    </ol>
    <div class="typed"><input class="inp" id="gTok" type="password" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="GitHub token"><button class="btn" id="gGo" type="button">Kết nối</button></div>
    <p class="msg" id="gMsg"></p>

  const go=async()=>{
    const v=$('#gTok').value.trim(),m=$('#gMsg');

      <p><b>iPhone, iPad:</b> vào Settings → Accessibility → <b>Read &amp; Speak</b> → Voices (iOS 18 trở về trước là Spoken Content; hoặc gõ “Voices” vào ô tìm kiếm của Settings). Mở Korean, tải giọng có chữ <b>Enhanced</b> hoặc <b>Premium</b> (ví dụ Yuna), rồi <b>chạm vào giọng đó để đánh dấu chọn</b>. Làm tương tự với English, chọn một giọng UK. Safari trên iPhone thường không hiện các giọng tải thêm trong danh sách ở trên, nên hãy để ô giọng ở “Tự động: giọng mặc định của máy” để iPhone dùng giọng bạn đã chọn. Nếu chưa nghe thấy thay đổi, hãy tắt hẳn Safari hoặc app rồi mở lại.</p>
      <p><b>Android:</b> Cài đặt → Hệ thống hoặc Trợ năng → Chuyển văn bản thành lời nói → chọn “Dịch vụ lời nói của Google” → mở phần cài đặt của nó → Cài đặt dữ liệu giọng nói → tải tiếng Hàn và tiếng Anh. Tên menu có thể khác đôi chút tùy hãng máy.</p>
      <p><b>Mac:</b> Cài đặt hệ thống → Trợ năng → Nội dung được đọc → Giọng hệ thống → Quản lý giọng, rồi tải Yuna (bản Nâng cao hoặc Cao cấp) và một giọng tiếng Anh.</p>
    </details>
  </section>
  <section class="set" id="syncSec"><h3>Đồng bộ</h3><div id="syncBox"></div></section>
  <section class="set"><h3>Tiến độ</h3>
    <p class="muted" style="margin:0 0 12px">Xóa toàn bộ lịch ôn của ${LNAME[S.lang]}. Từ bạn tự thêm vẫn được giữ lại.</p>
    <button class="btn danger" id="reset">Xóa tiến độ ${LNAME[S.lang]}</button>
  </section>`;
  const touch=()=>{S.sAt=Date.now();save();R.built=false;renderHeader()};
  $('#sNew').addEventListener('change',e=>{s.newPerDay=+e.target.value;touch()});
  $$('[data-dir]').forEach(b=>b.addEventListener('click',()=>{s.dir=b.dataset.dir;touch();viewSettings()}));
  $('#sAuto').addEventListener('change',e=>{s.autoplay=e.target.checked;touch()});
  $('#sRate').addEventListener('change',e=>{s.rate=+e.target.value;touch();speak(VSAMPLE[S.lang],S.lang)});
  ['ko','en'].forEach(L=>{const sel=$('#v-'+L);if(sel)sel.addEventListener('change',()=>{VPREF[L]=sel.value;saveVPref();renderVoiceInfo();speak(VSAMPLE[L],L)})});
  $('#reset').addEventListener('click',()=>{
    if(!confirm(`Xóa toàn bộ tiến độ học ${LNAME[S.lang]}? Không thể hoàn tác.`))return;
    S.cards[S.lang]={};S.reset[S.lang]=Date.now();save();R.built=false;QS.quiz=QS.listen=null;renderHeader();viewSettings();
  });
  renderVoiceInfo();renderSyncBox();
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select'))return;
  if(e.target.closest('button')&&(e.key==='Enter'||e.key===' '))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(VIEW==='review'&&R.cur){
    if(!R.flipped&&(e.key===' '||e.key==='Enter')){e.preventDefault();flip()}
    else if(R.flipped&&'1234'.includes(e.key)&&e.key.length===1){grade(+e.key-1)}
  }else if((VIEW==='quiz'||VIEW==='listen')&&QS[VIEW]&&!QS[VIEW].empty&&!QS[VIEW].done){
    const Q=QS[VIEW];
    if(!Q.answered&&'1234'.includes(e.key)&&e.key.length===1)answer(+e.key-1);
    else if(Q.answered&&e.key==='Enter')nextQ();
  }
});

rebuildDecks();render();initSync();if(gistOn())gistSync();
if(!IN_CLAUDE&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
